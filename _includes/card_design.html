{% if design.finished %}
<a href="{{ design.url | absolute_url }}" class="card-link">
{% else %}
<a class="card-link disabled-card">
{% endif %}

<div class="card card-design">
  <div class="media media--4-3">
    <div class="zoom-basico">

      <div class="primary-title">
        <h2 class="primary-text">{{ design.title }}</h2>
      </div>

      {% if design.cover-img %}
        {% if design.finished %}
          <img src="{{ design.cover-img | absolute_url }}" alt="" width="960" height="640" loading="lazy" decoding="async">
        {% else %}
          <img src="{{ design.cover-img | absolute_url }}" alt="" width="960" height="640" loading="lazy" decoding="async" class="gray">
        {% endif %}
      {% endif %}

    </div>
  </div>
</div>

</a>
