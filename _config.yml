title: Torre Escribana
author: Permacultura Aragón
navbar-links:
  Inicio: /
  Proyecto:
  - Permacultura: diseno
  - Descubre: proyecto
  - Quiénes Somos: nosotras
  Visitas: visitas
  Agenda: agenda
  Voluntariado: /voluntariado/
  Contacto: contacto
round-avatar: true
title-img: /assets/img/logonuevo2.png
social-network-links:
  email: torreescribana@gmail.com
  instagram: torrescribana
  telephone: 34644304883
  telegram: torreescribana
rss-description: Web sobre el proyecto vivencial Torre Escribana
share-links-active:
  twitter: true
  facebook: true
  instagram: true
  telephone: true
  vk: false
url-pretty: www.torre-escribana.com
title-on-all-pages: true
excerpt_length: 50
feed_show_excerpt: true
feed_show_tags: true
post_search: false
edit_page_button: false
navbar-var-length: true
navbar-col: '#eaeaea'
navbar-text-col: '#404040'
navbar-border-col: '#DDDDDD'
page-col: '#FFFFFF'
text-col: '#404040'
link-col: '#86c742'
hover-col: '#84bb2e'
footer-col: '#eaeaea'
footer-text-col: '#777777'
footer-link-col: '#404040'
footer-hover-col: '#84bb2e'
date_format: '%e %h %G'
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/
paginate: 5
kramdown:
  input: GFM
defaults:
- scope:
    path: ''
    type: posts
  values:
    layout: post
    comments: true
    social-share: true
- scope:
    path: ''
  values:
    layout: page
- scope:
    path: ''
    type: agenda
  values:
    layout: evento
- scope:
    path: ''
    type: disenos
  values:
    layout: page
future: true
exclude:
- CHANGELOG.md
- CNAME
- Gemfile
- Gemfile.lock
- LICENSE
- README.md
- screenshot.png
- docs/
- scripts/
- package.json
- package-lock.json
- node_modules/
- assets/img/logonuevo2.psd
- _config.preview.yml
- assets/vendor/
- assets/fonts/fa-solid.woff2
- assets/fonts/fa-brands.woff2
- assets/fonts/EscribanaFont.otf
- assets/css/torre-escribana.css
- assets/js/beautifuljekyll.js
- REVISION-2026-09.md
plugins:
- jekyll-paginate
- jekyll-sitemap
collections:
  agenda:
    output: true
    permalink: /:collection/:path/
  disenos:
    output: true
    permalink: /:collection/:path/
url: https://torre-escribana.com
baseurl: ''
language: es
timezone: Europe/Madrid
description: Centro demostrativo de permacultura en Montañana, Zaragoza. Visitas,
  formación y voluntariado para aprender a cuidar la tierra y a las personas.
